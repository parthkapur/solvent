[project]
name = "solvent"
version = "0.1.0"
description = "Governed MCP server: read tools free, write tools need a human-minted approval token."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "azure-identity>=1.17",
  "azure-mgmt-costmanagement>=4",
  "azure-mgmt-appcontainers>=3",
  "azure-monitor-opentelemetry>=1.6",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
    "hypothesis>=6.168.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
