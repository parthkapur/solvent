trigger:
  branches:
    include: [main]
  paths:
    exclude: ["*.md"] # docs never need a deploy

pool:
  vmImage: ubuntu-latest

variables:
  - group: solvent # AZURE_SERVICE_CONNECTION, APPROVAL_SECRET + API_KEY (secret), APPROVERS, ALERT_EMAIL,
  #                  ENTRA_TENANT_ID, ENTRA_AUDIENCE, DEV_APPROVAL_SECRET + DEV_API_KEY (secret)
  - name: TF_IN_AUTOMATION
    value: "true"

stages:
  - stage: Validate
    jobs:
      - job: app
        displayName: lint + unit/contract tests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: pip install -q uv && uv sync --frozen
            displayName: install
          - script: uv run ruff check . && uv run pytest -q --junitxml=test-results.xml
            displayName: ruff + pytest
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFiles: test-results.xml

      - job: infra
        displayName: terraform fmt/validate/tflint/plan
        steps:
          - template: install-tools.yml
          - task: AzureCLI@2
            displayName: terraform plan
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: infra
              inlineScript: |
                set -euo pipefail
                export ARM_USE_OIDC=true ARM_OIDC_TOKEN=$idToken ARM_CLIENT_ID=$servicePrincipalId \
                       ARM_TENANT_ID=$tenantId ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                # fmt and lint the whole tree; plan only the prod root.
                terraform fmt -check -recursive
                tflint --init && tflint --recursive
                cd envs/prod
                terraform init -input=false -backend-config=backend.hcl
                terraform validate
                # A variable missing from the group arrives as the literal $(API_KEY); unquoted,
                # bash command-substitutes it to nothing and Terraform plans an empty secret that
                # only fails at apply. Single quotes keep it inert so the check can see it.
                # ponytail: asserts the 64-hex shape of `openssl rand -hex 32`; widen if the key
                # format changes.
                KEY='$(API_KEY)'
                [ ${#KEY} -eq 64 ] || { echo "##vso[task.logissue type=error]API_KEY missing or malformed in variable group 'solvent' (expected 64 hex chars)"; exit 1; }
                terraform plan -input=false -out=$(Build.ArtifactStagingDirectory)/tfplan \
                  -var image_tag=$(Build.SourceVersion) \
                  -var approval_secret=$(APPROVAL_SECRET) \
                  -var api_key="$KEY" \
                  -var approvers=$(APPROVERS) \
                  -var alert_email=$(ALERT_EMAIL) \
                  -var entra_tenant_id=$(ENTRA_TENANT_ID) \
                  -var entra_audience=$(ENTRA_AUDIENCE)
                # Nothing here fails the build on a destroy. Expected plans are creates-plus-
                # in-place-changes; a delete showing up is either a verified-safe replacement
                # (the ACR, via the module's moved block) or something nobody has checked
                # offline (e.g. whether widening the audit storage account's immutability
                # policy forces replacement, which would destroy exported audit blobs) - either
                # way it needs a human, not an auto-apply. A legitimate destroy means editing
                # this guard deliberately, not deleting it because it fired once.
                terraform show -json $(Build.ArtifactStagingDirectory)/tfplan \
                  | jq -e '[.resource_changes[] | select(.change.actions | index("delete"))] | length == 0' >/dev/null \
                  || { echo "##vso[task.logissue type=error]plan contains destroys — review by hand"; exit 1; }
          - script: |
              set -euo pipefail
              pip install -q checkov
              # Accepted findings live in .checkov.yaml, each with its reason.
              checkov --config-file .checkov.yaml
            displayName: checkov
          - publish: $(Build.ArtifactStagingDirectory)/tfplan
            artifact: tfplan

      - job: infra_dev
        displayName: terraform plan (dev, applied in Deploy)
        steps:
          - template: install-tools.yml
          - task: AzureCLI@2
            displayName: terraform plan dev
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: infra/envs/dev
              inlineScript: |
                set -euo pipefail
                export ARM_USE_OIDC=true ARM_OIDC_TOKEN=$idToken ARM_CLIENT_ID=$servicePrincipalId \
                       ARM_TENANT_ID=$tenantId ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform init -input=false -backend-config=backend.hcl
                # Same single-quote-then-length-check as the infra job's API_KEY guard above:
                # a missing variable arrives as the literal $(DEV_API_KEY), and quoting keeps it
                # inert so the check can see it instead of an unquoted empty string.
                # ponytail: asserts the 64-hex shape of `openssl rand -hex 32`; widen if the key
                # format changes.
                KEY='$(DEV_API_KEY)'
                [ ${#KEY} -eq 64 ] || { echo "##vso[task.logissue type=error]DEV_API_KEY missing or malformed in variable group 'solvent' (expected 64 hex chars)"; exit 1; }
                ACR_ID=$(az acr show -n $(az acr list -g solvent-rg --query '[0].name' -o tsv) -g solvent-rg --query id -o tsv)
                ACR_SERVER=$(az acr show -n $(az acr list -g solvent-rg --query '[0].name' -o tsv) -g solvent-rg --query loginServer -o tsv)
                # A trial subscription allows one Container App Environment per region, so dev
                # runs inside prod's rather than being refused at apply time with
                # MaxNumberOfRegionalEnvironmentsInSubExceeded.
                CAE_ID=$(az containerapp env show -n solvent-env -g solvent-rg --query id -o tsv)
                terraform plan -input=false -out=$(Build.ArtifactStagingDirectory)/tfplan-dev \
                  -var image_tag=$(Build.SourceVersion) \
                  -var approval_secret=$(DEV_APPROVAL_SECRET) \
                  -var api_key="$KEY" \
                  -var approvers=$(APPROVERS) \
                  -var entra_tenant_id=$(ENTRA_TENANT_ID) \
                  -var entra_audience=$(ENTRA_AUDIENCE) \
                  -var registry_id="$ACR_ID" \
                  -var registry_login_server="$ACR_SERVER" \
                  -var container_app_environment_id="$CAE_ID"
                # Same guard as the infra job's plan, applied to dev's own plan file.
                terraform show -json $(Build.ArtifactStagingDirectory)/tfplan-dev \
                  | jq -e '[.resource_changes[] | select(.change.actions | index("delete"))] | length == 0' >/dev/null \
                  || { echo "##vso[task.logissue type=error]plan contains destroys — review by hand"; exit 1; }
          - publish: $(Build.ArtifactStagingDirectory)/tfplan-dev
            artifact: tfplan-dev

  - stage: Build
    dependsOn: Validate
    jobs:
      - job: image
        displayName: build + push to ACR
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # ACR Tasks (az acr build) are disabled on free/trial subscriptions; build on the agent.
                ACR=$(az acr list -g solvent-rg --query "[0].loginServer" -o tsv)
                az acr login -n "${ACR%%.*}"
                docker build -t "$ACR/solvent:$(Build.SourceVersion)" .
                docker push "$ACR/solvent:$(Build.SourceVersion)"

  - stage: Deploy
    dependsOn: Build
    jobs:
      - deployment: dev
        environment: prod # same approval check as prod covers both; dev applies first so a
        #                   module change that breaks an environment breaks the cheap one first
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan-dev
                - template: install-tools.yml
                - task: AzureCLI@2
                  displayName: terraform apply (saved plan)
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: infra
                    inlineScript: |
                      set -euo pipefail
                      export ARM_USE_OIDC=true ARM_OIDC_TOKEN=$idToken ARM_CLIENT_ID=$servicePrincipalId \
                             ARM_TENANT_ID=$tenantId ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      cd envs/dev
                      terraform init -input=false -backend-config=backend.hcl
                      terraform apply -input=false $(Pipeline.Workspace)/tfplan-dev/tfplan-dev

      - deployment: prod
        dependsOn: dev
        environment: prod # manual approval check lives on the environment, not in YAML
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan
                - template: install-tools.yml
                - task: AzureCLI@2
                  displayName: terraform apply (saved plan) + smoke
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: infra
                    inlineScript: |
                      set -euo pipefail
                      export ARM_USE_OIDC=true ARM_OIDC_TOKEN=$idToken ARM_CLIENT_ID=$servicePrincipalId \
                             ARM_TENANT_ID=$tenantId ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      cd envs/prod
                      terraform init -input=false -backend-config=backend.hcl
                      terraform apply -input=false $(Pipeline.Workspace)/tfplan/tfplan
                      URL=$(terraform output -raw app_url)
                      az config set extension.use_dynamic_install=yes_without_prompt -o none
                      # /healthz alone is not enough: the previous revision keeps serving until the new one is ready.
                      for i in $(seq 1 30); do
                        R=$(az containerapp show -n solvent-app -g solvent-rg --query "[properties.latestRevisionName,properties.latestReadyRevisionName]" -o tsv | uniq | wc -l)
                        [ "$R" -eq 1 ] && break; sleep 10
                      done
                      [ "$R" -eq 1 ] || { echo "new revision never became ready"; exit 1; }
                      curl -fsS "$URL/healthz"
                      curl -fsS -X POST "$URL/mcp" \
                        -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
                        -H "authorization: Bearer $(API_KEY)" \
                        -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
                        | grep -q restart_container_app && echo "smoke ok"
                      # Prove the gate is closed rather than assuming it.
                      code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/mcp" \
                        -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
                        -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
                      [ "$code" = "401" ] || { echo "/mcp answered $code unauthenticated, expected 401"; exit 1; }
                      echo "auth gate ok"
