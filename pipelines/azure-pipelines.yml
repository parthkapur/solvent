trigger:
  branches:
    include: [main]
  paths:
    exclude: ["*.md"] # docs never need a deploy

pool:
  vmImage: ubuntu-latest

variables:
  - group: solvent # AZURE_SERVICE_CONNECTION, APPROVAL_SECRET + API_KEY (secret), APPROVERS, ALERT_EMAIL
  - name: TF_IN_AUTOMATION
    value: "true"

stages:
  - stage: Validate
    jobs:
      - job: app
        displayName: lint + unit/contract tests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: pip install -q uv && uv sync --frozen
            displayName: install
          - script: uv run ruff check . && uv run pytest -q --junitxml=test-results.xml
            displayName: ruff + pytest
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFiles: test-results.xml

      - job: infra
        displayName: terraform fmt/validate/tflint/plan
        steps:
          - template: install-tools.yml
          - task: AzureCLI@2
            displayName: terraform plan
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: infra
              inlineScript: |
                set -euo pipefail
                export ARM_USE_OIDC=true ARM_OIDC_TOKEN=$idToken ARM_CLIENT_ID=$servicePrincipalId \
                       ARM_TENANT_ID=$tenantId ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform init -input=false -backend-config=backend.hcl
                terraform fmt -check -recursive
                terraform validate
                tflint --init && tflint
                terraform plan -input=false -out=$(Build.ArtifactStagingDirectory)/tfplan \
                  -var image_tag=$(Build.SourceVersion) \
                  -var approval_secret=$(APPROVAL_SECRET) \
                  -var api_key=$(API_KEY) \
                  -var approvers=$(APPROVERS) \
                  -var alert_email=$(ALERT_EMAIL)
          - script: |
              set -euo pipefail
              pip install -q checkov
              # Accepted findings live in .checkov.yaml, each with its reason.
              checkov --config-file .checkov.yaml
            displayName: checkov
          - publish: $(Build.ArtifactStagingDirectory)/tfplan
            artifact: tfplan

  - stage: Build
    dependsOn: Validate
    jobs:
      - job: image
        displayName: build + push to ACR
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # ACR Tasks (az acr build) are disabled on free/trial subscriptions; build on the agent.
                ACR=$(az acr list -g solvent-rg --query "[0].loginServer" -o tsv)
                az acr login -n "${ACR%%.*}"
                docker build -t "$ACR/solvent:$(Build.SourceVersion)" .
                docker push "$ACR/solvent:$(Build.SourceVersion)"

  - stage: Deploy
    dependsOn: Build
    jobs:
      - deployment: prod
        environment: prod # manual approval check lives on the environment, not in YAML
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan
                - template: install-tools.yml
                - task: AzureCLI@2
                  displayName: terraform apply (saved plan) + smoke
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    workingDirectory: infra
                    inlineScript: |
                      set -euo pipefail
                      export ARM_USE_OIDC=true ARM_OIDC_TOKEN=$idToken ARM_CLIENT_ID=$servicePrincipalId \
                             ARM_TENANT_ID=$tenantId ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      terraform init -input=false -backend-config=backend.hcl
                      terraform apply -input=false $(Pipeline.Workspace)/tfplan/tfplan
                      URL=$(terraform output -raw app_url)
                      az config set extension.use_dynamic_install=yes_without_prompt -o none
                      # /healthz alone is not enough: the previous revision keeps serving until the new one is ready.
                      for i in $(seq 1 30); do
                        R=$(az containerapp show -n solvent-app -g solvent-rg --query "[properties.latestRevisionName,properties.latestReadyRevisionName]" -o tsv | uniq | wc -l)
                        [ "$R" -eq 1 ] && break; sleep 10
                      done
                      [ "$R" -eq 1 ] || { echo "new revision never became ready"; exit 1; }
                      curl -fsS "$URL/healthz"
                      curl -fsS -X POST "$URL/mcp" \
                        -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
                        -H "authorization: Bearer $(API_KEY)" \
                        -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
                        | grep -q restart_container_app && echo "smoke ok"
                      # Prove the gate is closed rather than assuming it.
                      code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/mcp" \
                        -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
                        -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
                      [ "$code" = "401" ] || { echo "/mcp answered $code unauthenticated, expected 401"; exit 1; }
                      echo "auth gate ok"
